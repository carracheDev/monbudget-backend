services:
  - type: web
    name: monbudget-backend
    runtime: node
    buildCommand: npm ci --include=dev && npm run build
    startCommand: ./start.sh
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: NODE_ENV
        value: production